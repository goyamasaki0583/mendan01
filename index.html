<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北谷第二小学校個人面談ネット予約サイト</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .no-select { user-select: none; -webkit-user-select: none; }
        
        /* === 完璧なPDF印刷のための設定 === */
        @media print {
            @page {
                size: A4 landscape; /* A4 横向き */
                margin: 10mm 15mm;  /* 上下10mm, 左右15mmにして縦幅を確保 */
            }
            body {
                background-color: white !important;
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            /* UI要素を隠す */
            header, .no-print {
                display: none !important;
            }
            /* メインコンテンツを全画面に */
            main {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }
            /* 表がはみ出さないようにA4幅に調整 */
            table {
                width: 100% !important;
                max-width: 100% !important;
                border-collapse: collapse !important;
            }
            th, td {
                border: 1px solid #9ca3af !important;
                word-wrap: break-word !important;
            }
            /* 背景色を印刷に強制反映 */
            .print\:bg-gray-50 { background-color: #f9fafb !important; }
            .print\:bg-blue-50 { background-color: #eff6ff !important; }
            .print\:bg-blue-100 { background-color: #dbeafe !important; }
            .print\:bg-green-100 { background-color: #dcfce3 !important; }
            .print\:bg-gray-300 { background-color: #d1d5db !important; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const App = () => {
            // 1. 学年・クラスの選択ステート
            const [selectedGrade, setSelectedGrade] = useState('');
            const [selectedClass, setSelectedClass] = useState('');
            
            // 2. 面談設定ステート (管理者用) - デフォルト 14:00〜16:30
            const [settings, setSettings] = useState({
                dates: ['', '', '', '', '', ''], 
                startTime: '14:00',
                endTime: '16:30',
                slotsPerHour: 4 
            });
            
            // 3. 予約データステート
            const [bookings, setBookings] = useState({}); 

            // 4. モーダルとUI制御ステート
            const [isSettingsAuthOpen, setIsSettingsAuthOpen] = useState(false);
            const [settingsPassword, setSettingsPassword] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            const [bookingModal, setBookingModal] = useState({ isOpen: false, date: '', time: '', studentName: '', error: '' });
            const [cancelModal, setCancelModal] = useState({ isOpen: false, date: '', time: '', password: '', error: '', type: '' });
            const [bulkModal, setBulkModal] = useState({ isOpen: false, selectedCells: [], password: '', error: '' });

            // 5. ドラッグ操作（一括選択）ステート
            const [isDragging, setIsDragging] = useState(false);
            const [dragSelected, setDragSelected] = useState([]);

            // --- Helper Functions ---
            const formatMonthDay = (dateStr) => {
                if (!dateStr) return '';
                const d = new Date(dateStr);
                return `${d.getMonth() + 1}/${d.getDate()}`;
            };

            const formatDayOfWeek = (dateStr) => {
                if (!dateStr) return '';
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                const d = new Date(dateStr);
                return days[d.getDay()];
            };

            const activeDates = useMemo(() => {
                return settings.dates.filter(d => d !== '');
            }, [settings.dates]);

            const timeSlots = useMemo(() => {
                const slots = [];
                const startHours = parseInt(settings.startTime.split(':')[0]);
                const startMins = parseInt(settings.startTime.split(':')[1]);
                const endHours = parseInt(settings.endTime.split(':')[0]);
                const endMins = parseInt(settings.endTime.split(':')[1]);
                
                const start = startHours * 60 + startMins;
                const end = endHours * 60 + endMins;
                const interval = 60 / settings.slotsPerHour;
                
                for (let time = start; time < end; time += interval) {
                    const h = Math.floor(time / 60).toString().padStart(2, '0');
                    const m = (time % 60).toString().padStart(2, '0');
                    slots.push(`${h}:${m}`);
                }
                return slots;
            }, [settings.startTime, settings.endTime, settings.slotsPerHour]);

            // --- セルのクリック・ドラッグ操作 ---
            const handleSingleCellClick = (date, time) => {
                const key = `${selectedGrade}-${selectedClass}-${date}-${time}`;
                const booking = bookings[key];
                
                if (booking) {
                    if (booking.isBlocked) {
                        setCancelModal({ isOpen: true, date, time, password: '', error: '', type: 'unblock' });
                    } else {
                        setCancelModal({ isOpen: true, date, time, password: '', error: '', type: 'cancel' });
                    }
                } else {
                    setBookingModal({ isOpen: true, date, time, studentName: '', error: '' });
                }
            };

            const handleMouseDown = (e, date, time) => {
                if (!selectedGrade || !selectedClass) return;
                if (e.button !== 0) return; 
                e.preventDefault();
                setIsDragging(true);
                setDragSelected([{date, time}]);
            };

            const handleMouseEnter = (e, date, time) => {
                if (isDragging) {
                    if (!dragSelected.some(c => c.date === date && c.time === time)) {
                        setDragSelected(prev => [...prev, {date, time}]);
                    }
                }
            };

            useEffect(() => {
                const handleGlobalMouseUp = () => {
                    if (isDragging) {
                        setIsDragging(false);
                        if (dragSelected.length > 1) {
                            setBulkModal({ isOpen: true, selectedCells: dragSelected, password: '', error: '' });
                        } else if (dragSelected.length === 1) {
                            handleSingleCellClick(dragSelected[0].date, dragSelected[0].time);
                        }
                        setDragSelected([]);
                    }
                };
                
                window.addEventListener('mouseup', handleGlobalMouseUp);
                return () => window.removeEventListener('mouseup', handleGlobalMouseUp);
            }, [isDragging, dragSelected, selectedGrade, selectedClass, bookings]);

            // --- 予約・削除・ブロック処理 ---
            const saveBooking = () => {
                if (!bookingModal.studentName.trim()) {
                    setBookingModal({...bookingModal, error: '児童氏名を入力してください。'});
                    return;
                }
                const key = `${selectedGrade}-${selectedClass}-${bookingModal.date}-${bookingModal.time}`;
                setBookings({
                    ...bookings,
                    [key]: { studentName: bookingModal.studentName, isBlocked: false }
                });
                setBookingModal({ isOpen: false, date: '', time: '', studentName: '', error: '' });
            };

            const handleCancelSubmit = () => {
                if (cancelModal.password !== '5858') {
                    setCancelModal({...cancelModal, error: 'パスワードが間違っています。'});
                    return;
                }
                const key = `${selectedGrade}-${selectedClass}-${cancelModal.date}-${cancelModal.time}`;
                const newBookings = { ...bookings };
                delete newBookings[key];
                setBookings(newBookings);
                setCancelModal({ isOpen: false, date: '', time: '', password: '', error: '', type: '' });
            };

            const handleBulkAction = (actionType) => {
                if (bulkModal.password !== '5858') {
                    setBulkModal({...bulkModal, error: 'パスワードが間違っています。'});
                    return;
                }
                
                const newBookings = { ...bookings };
                bulkModal.selectedCells.forEach(({date, time}) => {
                    const key = `${selectedGrade}-${selectedClass}-${date}-${time}`;
                    if (actionType === 'block') {
                        newBookings[key] = { isBlocked: true };
                    } else if (actionType === 'unblock') {
                        if (newBookings[key] && newBookings[key].isBlocked) {
                            delete newBookings[key];
                        }
                    }
                });
                setBookings(newBookings);
                setBulkModal({ isOpen: false, selectedCells: [], password: '', error: '' });
            };

            // ブラウザ標準機能で印刷/PDF出力
            const handleDownloadPDF = () => {
                if (!selectedGrade || !selectedClass) return;
                window.print();
            };

            // --- UIの描画 ---
            return (
                <div className="min-h-screen pb-16 flex flex-col relative">
                    {/* ヘッダー */}
                    <header className="bg-white shadow-md sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-nowrap justify-between items-center gap-4 overflow-x-auto whitespace-nowrap">
                            
                            <h1 className="text-xl md:text-2xl font-bold text-blue-800 shrink-0">
                                <i className="fas fa-calendar-check mr-2"></i>北谷第二小学校個人面談ネット予約サイト
                            </h1>

                            <div className="flex flex-nowrap items-center justify-center gap-3 bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 flex-1 min-w-max">
                                <select 
                                    className="w-32 border-gray-300 rounded-md shadow-sm p-2 bg-white font-bold"
                                    value={selectedGrade}
                                    onChange={(e) => setSelectedGrade(e.target.value)}
                                >
                                    <option value="">学年を選択</option>
                                    {[1, 2, 3, 4, 5, 6].map(g => <option key={g} value={g}>{g}年</option>)}
                                </select>
                                <select 
                                    className="w-32 border-gray-300 rounded-md shadow-sm p-2 bg-white font-bold"
                                    value={selectedClass}
                                    onChange={(e) => setSelectedClass(e.target.value)}
                                >
                                    <option value="">クラスを選択</option>
                                    {[1, 2, 3, 4, 5].map(c => <option key={c} value={c}>{c}組</option>)}
                                </select>
                                <button 
                                    onClick={handleDownloadPDF}
                                    disabled={!selectedGrade || !selectedClass}
                                    className={`font-bold py-2 px-4 rounded shadow flex justify-center items-center transition-colors ${(!selectedGrade || !selectedClass) ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700 text-white'}`}
                                >
                                    <i className="fas fa-print mr-2"></i>PDF / 印刷
                                </button>
                            </div>

                            <button 
                                onClick={() => setIsSettingsAuthOpen(true)}
                                className="text-gray-400 hover:text-gray-700 transition-colors p-2 shrink-0"
                                title="面談設定 (管理者用)"
                            >
                                <i className="fas fa-cog text-2xl"></i>
                            </button>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main id="pdf-content" className="w-full max-w-6xl mx-auto px-4 mt-6">
                        
                        {/* 印刷時のみ表示されるタイトル（1行にまとめる） */}
                        <div className="hidden print:flex mb-4 justify-center items-baseline gap-6">
                            <h2 className="text-2xl font-bold text-gray-800 m-0">北谷第二小学校 個人面談予約表</h2>
                            <p className="text-xl font-bold text-gray-700 m-0">{selectedGrade}年 {selectedClass}組</p>
                        </div>

                        {!selectedGrade || !selectedClass ? (
                            <div className="flex flex-col items-center justify-center h-64 text-gray-500 no-print">
                                <i className="fas fa-hand-pointer text-4xl mb-4"></i>
                                <p className="text-lg">上部のメニューから学年とクラスを選択してください。</p>
                            </div>
                        ) : activeDates.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-64 text-gray-500 no-print">
                                <i className="fas fa-calendar-times text-4xl mb-4"></i>
                                <p className="text-lg">面談日が設定されていません。右上の歯車アイコンから設定してください。</p>
                            </div>
                        ) : (
                            <div className="bg-white rounded-lg shadow overflow-hidden print:shadow-none print:overflow-visible">
                                <div className="overflow-x-auto print:overflow-visible">
                                    <table className="w-full text-left border-collapse min-w-max print:min-w-0">
                                        <thead>
                                            <tr>
                                                <th className="bg-gray-50 print:bg-gray-50 border text-center text-gray-600 p-3 w-24 print:p-1 print:text-sm print:w-16">月日</th>
                                                {activeDates.map((date, idx) => (
                                                    <th key={idx} className="bg-blue-50 print:bg-blue-50 border text-center font-bold text-blue-900 p-3 text-lg w-32 min-w-[120px] print:min-w-0 print:p-1 print:text-base">
                                                        {formatMonthDay(date)}
                                                    </th>
                                                ))}
                                            </tr>
                                            <tr>
                                                <th className="bg-gray-50 print:bg-gray-50 border text-center text-gray-600 p-2 print:p-1 print:text-sm">曜日</th>
                                                {activeDates.map((date, idx) => (
                                                    <th key={idx} className="bg-blue-100 print:bg-blue-100 border text-center text-gray-700 p-2 print:p-1 print:text-sm">
                                                        {formatDayOfWeek(date)}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {timeSlots.map((time) => (
                                                <tr key={time} className="hover:bg-gray-50 transition-colors">
                                                    <td className="bg-gray-50 print:bg-gray-50 border text-center font-bold text-gray-700 p-2 print:p-1 print:text-sm">
                                                        {time}
                                                    </td>
                                                    {activeDates.map((date) => {
                                                        const key = `${selectedGrade}-${selectedClass}-${date}-${time}`;
                                                        const booking = bookings[key];
                                                        const isSelected = dragSelected.some(c => c.date === date && c.time === time);
                                                        
                                                        let cellClasses = "border text-center relative no-select transition-colors p-2 h-16 print:p-1 print:h-12 ";
                                                        let cellContent = null;
                                                        
                                                        if (booking) {
                                                            if (booking.isBlocked) {
                                                                cellClasses += "bg-gray-300 print:bg-gray-300 text-gray-600";
                                                                cellContent = <span className="font-bold print:text-sm">✖ 予約不可</span>;
                                                            } else {
                                                                cellClasses += "bg-green-100 print:bg-green-100 text-green-900";
                                                                cellContent = <span className="font-bold text-lg print:text-base">{booking.studentName}</span>;
                                                            }
                                                        } else {
                                                            cellClasses += "hover:bg-blue-50 cursor-pointer print:bg-white";
                                                            cellContent = <div className="w-full h-full flex items-center justify-center text-blue-500 hover:text-blue-700 pointer-events-none no-print"><i className="far fa-circle text-xl"></i></div>;
                                                        }

                                                        if (isSelected) {
                                                            cellClasses += " ring-2 ring-blue-500 bg-blue-200 z-10 scale-105 no-print";
                                                        }

                                                        return (
                                                            <td 
                                                                key={`${date}-${time}`}
                                                                className={cellClasses}
                                                                onMouseDown={(e) => handleMouseDown(e, date, time)}
                                                                onMouseEnter={(e) => handleMouseEnter(e, date, time)}
                                                            >
                                                                {cellContent}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* --- モーダル群 (印刷時は全て非表示) --- */}
                    <div className="no-print">
                        {/* 管理者認証モーダル */}
                        {isSettingsAuthOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm">
                                    <h3 className="text-xl font-bold mb-4">管理者認証</h3>
                                    <p className="mb-4 text-gray-600 text-sm">設定を開くにはパスワードを入力してください。</p>
                                    <input 
                                        type="password" 
                                        autoFocus
                                        value={settingsPassword}
                                        onChange={(e) => setSettingsPassword(e.target.value)}
                                        className="border rounded w-full py-2 px-3 mb-4"
                                        placeholder="パスワード"
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button onClick={() => {setIsSettingsAuthOpen(false); setSettingsPassword('');}} className="bg-gray-300 hover:bg-gray-400 px-4 py-2 rounded">キャンセル</button>
                                        <button onClick={() => {
                                            if (settingsPassword === '5858') {
                                                setIsSettingsAuthOpen(false);
                                                setSettingsPassword('');
                                                setIsSettingsOpen(true);
                                            } else {
                                                alert("パスワードが間違っています。");
                                            }
                                        }} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">認証</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 設定モーダル */}
                        {isSettingsOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-md max-h-screen overflow-y-auto">
                                    <h3 className="text-xl font-bold mb-4 border-b pb-2">全体設定 (管理者用)</h3>
                                    
                                    <div className="mb-6">
                                        <label className="block text-gray-700 font-bold mb-2">面談日 (最大6日間)</label>
                                        <div className="grid grid-cols-2 gap-2">
                                            {[0, 1, 2, 3, 4, 5].map(i => (
                                                <input 
                                                    key={i}
                                                    type={settings.dates[i] ? "date" : "text"} 
                                                    placeholder={`${i + 1}日目`}
                                                    value={settings.dates[i]} 
                                                    onFocus={(e) => e.target.type = 'date'}
                                                    onBlur={(e) => { if (!e.target.value) e.target.type = 'text'; }}
                                                    onChange={(e) => {
                                                        const newDates = [...settings.dates];
                                                        newDates[i] = e.target.value;
                                                        setSettings({...settings, dates: newDates});
                                                    }}
                                                    className="border rounded px-2 py-1"
                                                />
                                            ))}
                                        </div>
                                        <p className="text-xs text-gray-500 mt-1">※設定しない日は空欄にしてください。</p>
                                    </div>

                                    <div className="flex gap-4 mb-4">
                                        <div className="w-1/2">
                                            <label className="block text-gray-700 font-bold mb-2">開始時間</label>
                                            <input type="time" value={settings.startTime} onChange={e => setSettings({...settings, startTime: e.target.value})} className="border rounded w-full py-2 px-3"/>
                                        </div>
                                        <div className="w-1/2">
                                            <label className="block text-gray-700 font-bold mb-2">終了時間</label>
                                            <input type="time" value={settings.endTime} onChange={e => setSettings({...settings, endTime: e.target.value})} className="border rounded w-full py-2 px-3"/>
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <label className="block text-gray-700 font-bold mb-2">1時間の枠数</label>
                                        <select value={settings.slotsPerHour} onChange={e => setSettings({...settings, slotsPerHour: parseInt(e.target.value)})} className="border rounded w-full py-2 px-3">
                                            <option value="2">2枠 (30分)</option>
                                            <option value="3">3枠 (20分)</option>
                                            <option value="4">4枠 (15分)</option>
                                            <option value="6">6枠 (10分)</option>
                                        </select>
                                    </div>

                                    <div className="flex justify-end gap-2 pt-4 border-t">
                                        <button onClick={() => setIsSettingsOpen(false)} className="bg-gray-300 hover:bg-gray-400 font-bold py-2 px-4 rounded">閉じる</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 予約入力モーダル */}
                        {bookingModal.isOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm">
                                    <h3 className="text-xl font-bold mb-2 text-blue-800">面談の予約</h3>
                                    <div className="bg-gray-100 p-3 rounded mb-4 text-center font-bold text-gray-700">
                                        {formatMonthDay(bookingModal.date)}({formatDayOfWeek(bookingModal.date)}) {bookingModal.time}
                                    </div>
                                    <div className="mb-4">
                                        <label className="block text-gray-700 text-sm font-bold mb-2">児童氏名</label>
                                        <input 
                                            type="text" 
                                            autoFocus
                                            value={bookingModal.studentName}
                                            onChange={(e) => setBookingModal({...bookingModal, studentName: e.target.value})}
                                            className="shadow appearance-none border rounded w-full py-3 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 text-lg"
                                            placeholder="例：北谷 太郎"
                                            onKeyDown={(e) => e.key === 'Enter' && saveBooking()}
                                        />
                                    </div>
                                    {bookingModal.error && <p className="text-red-500 text-sm mb-4 font-bold">{bookingModal.error}</p>}
                                    <div className="flex justify-end gap-2">
                                        <button onClick={() => setBookingModal({...bookingModal, isOpen: false})} className="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded">キャンセル</button>
                                        <button onClick={saveBooking} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">予約する</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* キャンセル・解除モーダル */}
                        {cancelModal.isOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm border-t-4 border-red-500">
                                    <h3 className="text-xl font-bold mb-4 text-red-600">
                                        {cancelModal.type === 'cancel' ? '予約の削除' : '「予約不可」の解除'}
                                    </h3>
                                    
                                    {cancelModal.type === 'cancel' && (
                                        <div className="bg-red-50 text-red-700 p-3 rounded-md mb-4 text-sm font-bold border border-red-200">
                                            <i className="fas fa-exclamation-triangle mr-1"></i>
                                            予約の削除する際には、担任に連絡をお願いします。
                                        </div>
                                    )}
                                    {cancelModal.type === 'unblock' && (
                                        <p className="mb-4 text-gray-700">この枠の「予約不可」設定を解除しますか？</p>
                                    )}

                                    <p className="mb-4 font-bold bg-gray-100 p-2 text-center rounded">
                                        {formatMonthDay(cancelModal.date)}({formatDayOfWeek(cancelModal.date)}) {cancelModal.time}
                                    </p>

                                    <div className="mb-4">
                                        <label className="block text-gray-700 text-sm font-bold mb-2">管理者/削除パスワード</label>
                                        <input 
                                            type="password" 
                                            autoFocus
                                            value={cancelModal.password}
                                            onChange={(e) => setCancelModal({...cancelModal, password: e.target.value})}
                                            className="shadow appearance-none border rounded w-full py-2 px-3"
                                            placeholder="パスワードを入力"
                                            onKeyDown={(e) => e.key === 'Enter' && handleCancelSubmit()}
                                        />
                                    </div>
                                    {cancelModal.error && <p className="text-red-500 text-sm mb-4 font-bold">{cancelModal.error}</p>}
                                    <div className="flex justify-end gap-2">
                                        <button onClick={() => setCancelModal({...cancelModal, isOpen: false})} className="bg-gray-300 hover:bg-gray-400 font-bold py-2 px-4 rounded">キャンセル</button>
                                        <button onClick={handleCancelSubmit} className="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                                            {cancelModal.type === 'cancel' ? '削除を実行' : '解除する'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 一括処理モーダル */}
                        {bulkModal.isOpen && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
                                    <h3 className="text-xl font-bold mb-4 border-b pb-2">一括処理 (管理者用)</h3>
                                    <p className="mb-4 text-gray-700 font-bold">{bulkModal.selectedCells.length}個の枠が選択されています。</p>
                                    
                                    <div className="mb-6">
                                        <label className="block text-gray-700 text-sm font-bold mb-2">管理者パスワード</label>
                                        <input 
                                            type="password" 
                                            autoFocus
                                            value={bulkModal.password}
                                            onChange={(e) => setBulkModal({...bulkModal, password: e.target.value})}
                                            className="shadow border rounded w-full py-2 px-3 text-lg"
                                            placeholder="パスワードを入力"
                                        />
                                    </div>
                                    {bulkModal.error && <p className="text-red-500 text-sm mb-4 font-bold">{bulkModal.error}</p>}
                                    
                                    <div className="flex flex-col gap-3">
                                        <button onClick={() => handleBulkAction('block')} className="w-full bg-gray-700 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded shadow">
                                            <i className="fas fa-ban mr-2"></i>選択した枠を予約不可にする
                                        </button>
                                        <button onClick={() => handleBulkAction('unblock')} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow">
                                            <i className="fas fa-unlock mr-2"></i>解除する
                                        </button>
                                        <button onClick={() => setBulkModal({...bulkModal, isOpen: false})} className="w-full mt-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded">
                                            キャンセル
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
